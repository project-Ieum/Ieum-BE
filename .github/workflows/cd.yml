name: CD

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/project-ieum/ieum-be

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # 테스트는 PR 단계의 CI 에서 이미 통과했으므로 여기서는 jar 만 만든다.
      - name: Build jar
        run: ./gradlew bootJar

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_TARGET: ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$EC2_TARGET" \
            "cd /opt/ieum && export IMAGE_TAG=${{ github.sha }} && docker compose pull app && docker compose up -d && docker image prune -f"
          rm -f ~/.ssh/deploy_key

      - name: Health check
        run: |
          for i in $(seq 1 18); do
            if curl -fsS "https://${{ vars.APP_DOMAIN }}/actuator/health"; then exit 0; fi
            sleep 5
          done
          echo "health check failed" && exit 1
