spring:
  application:
    name: ieum
  datasource:
    url: jdbc:postgresql://localhost:5432/ieum
    # 저장소에 비밀을 남기지 않는다. 환경변수가 없으면 기동 시 명확히 실패한다.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      # 스키마의 주인은 Flyway. Hibernate는 검증만
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # dev 에서는 스키마 초기화 허용
    clean-disabled: false

server:
  port: 8080

logging:
  level:
    com.ieum: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
