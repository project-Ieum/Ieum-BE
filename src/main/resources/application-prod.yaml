spring:
  application:
    name: ieum
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 운영에서는 clean 영구 차단
    clean-disabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  level:
    root: info
    com.ieum: info
